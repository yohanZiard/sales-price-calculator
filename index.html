function App() {

  const [searchTerm, setSearchTerm] = useState('');
  const [selectedItem, setSelectedItem] = useState(null);

  const [mrp, setMrp] = useState(0);
  const [vatType, setVatType] = useState('vat');
  const vatRate = 18;

  const [mode, setMode] = useState('rate');
  const [marginRateInput, setMarginRateInput] = useState('');
  const [targetNet, setTargetNet] = useState('');

  const results = useMemo(() => {
    if (!mrp) return null;

    const basePrice =
      vatType === 'vat'
        ? mrp / (1 + vatRate / 100)
        : mrp;

    const marginRate = Number(marginRateInput) || 0;
    const target = Number(targetNet) || 0;

    let net, marginPct;

    if (mode === 'rate') {
      net = basePrice * (1 - marginRate / 100);
      marginPct = marginRate;
    } else {
      net = target;
      marginPct = basePrice ? ((basePrice - net) / basePrice) * 100 : 0;
    }

    return {
      basePrice,
      net,
      marginPct,
      vat: vatType === 'vat' ? net * vatRate / 100 : 0,
      discount: ((mrp - net) / mrp) * 100
    };
  }, [mrp, vatType, marginRateInput, targetNet, mode]);

  const filtered = useMemo(() => {
    if (searchTerm.length < 2) return [];
    const q = searchTerm.toLowerCase();
    return PRODUCT_DATABASE.filter(p =>
      p.name.toLowerCase().includes(q) ||
      p.id.toLowerCase().includes(q)
    );
  }, [searchTerm]);

  return (
    <div className="max-w-xl mx-auto p-4">

      <h1 className="text-xl font-bold mb-4">Sales Price Calculator</h1>

      <input
        className="w-full p-3 border rounded mb-2"
        placeholder="Search item name or code"
        value={searchTerm}
        onChange={e => setSearchTerm(e.target.value)}
      />

      {filtered.length > 0 && (
        <div className="border rounded max-h-56 overflow-y-auto custom-scrollbar mb-4">
          {filtered.map(p => (
            <div
              key={p.id}
              className="p-3 hover:bg-blue-50 cursor-pointer flex justify-between"
              onClick={() => {
                setMrp(p.price);
                setSelectedItem(p);
                setSearchTerm('');
              }}
            >
              <div>
                <div className="font-bold">{p.name}</div>
                <div className="text-xs text-gray-500">{p.id} • {p.brand}</div>
              </div>
              <div className="font-bold">LKR {p.price}</div>
            </div>
          ))}
        </div>
      )}

      <div className="flex mb-4">
        <button className={`flex-1 p-2 ${vatType==='vat'?'bg-green-600 text-white':'bg-gray-200'}`}
          onClick={()=>setVatType('vat')}>VAT Customer</button>
        <button className={`flex-1 p-2 ${vatType==='nonvat'?'bg-green-600 text-white':'bg-gray-200'}`}
          onClick={()=>setVatType('nonvat')}>NON VAT Customer</button>
      </div>

      <div className="flex mb-4">
        <button className={`flex-1 p-2 ${mode==='rate'?'bg-blue-600 text-white':'bg-gray-200'}`}
          onClick={()=>setMode('rate')}>Margin %</button>
        <button className={`flex-1 p-2 ${mode==='amount'?'bg-blue-600 text-white':'bg-gray-200'}`}
          onClick={()=>setMode('amount')}>Target Price</button>
      </div>

      <input
        type="number"
        className="w-full p-3 border rounded mb-3"
        placeholder="MRP"
        value={mrp || ''}
        onChange={e=>setMrp(Number(e.target.value))}
      />

      {mode === 'rate' ? (
        <input
          type="number"
          className="w-full p-3 border rounded mb-3"
          placeholder="Margin %"
          value={marginRateInput}
          onChange={e=>setMarginRateInput(e.target.value)}
        />
      ) : (
        <input
          type="number"
          className="w-full p-3 border rounded mb-3"
          placeholder="Target Net Price"
          value={targetNet}
          onChange={e=>setTargetNet(e.target.value)}
        />
      )}

      {results && (
        <div className="bg-blue-900 text-white p-4 rounded">

          {selectedItem && (
            <div className="mb-3 text-sm text-blue-200">
              {selectedItem.name} ({selectedItem.id})
            </div>
          )}

          <div className="text-3xl font-bold mb-3">
            NET SELLING PRICE: LKR {results.net.toFixed(2)}
          </div>

          <div className="text-sm">MRP: {mrp.toFixed(2)}</div>
          <div className="text-sm">EX VAT: {results.basePrice.toFixed(2)}</div>
          <div className="text-sm">NET MARGIN RATE: {results.marginPct.toFixed(2)}%</div>

          {vatType === 'vat' && (
            <div className="text-sm">VAT: {results.vat.toFixed(2)}</div>
          )}

          <div className="text-sm text-red-300">
            TOTAL DISCOUNT RATE: {results.discount.toFixed(2)}%
          </div>
        </div>
      )}

    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
